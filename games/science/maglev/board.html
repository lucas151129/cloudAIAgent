<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7ec8ff">
<title>磁浮列車成績｜大螢幕</title>
<link rel="icon" href="../../../assets/games/sci-maglev.png">
<link rel="stylesheet" href="meet.css?v=3">
</head>
<body class="board">
  <div class="sky" aria-hidden="true">
    <i class="sun"></i>
    <i class="cloud c1"></i>
    <i class="cloud c2"></i>
    <i class="spark s1"></i>
    <i class="spark s2"></i>
    <i class="spark s3"></i>
  </div>
  <header class="board-top">
    <div class="brand">
      <img class="logo" src="../../../assets/games/sci-maglev.png" alt="" width="76" height="76">
      <div>
        <h1>三年級磁浮列車</h1>
        <p id="formula">6 米賽道 · 完成時間取兩次中較快的一次 · 速率＝6÷時間</p>
      </div>
    </div>
    <div class="board-tools">
      <div class="live" id="live"><i></i><span>即時成績</span></div>
      <button type="button" class="full" id="full">全螢幕</button>
    </div>
  </header>
  <main class="grid" id="grid"></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../../js/supabase-config.js?v=2"></script>
  <script src="meet.js?v=3"></script>
  <script>
    var MEDAL = ["", "第1名", "第2名", "第3名"];

    function esc(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
      });
    }

    function render(view) {
      var html = "";
      view.state.classes.forEach(function (klass) {
        var rows = MaglevMeet.top3(klass.groups);
        html += '<section class="panel ' + klass.id.toLowerCase() + '"><h2><span class="mark">' + MaglevMeet.trainIcon() + esc(klass.name) + '</span></h2>';
        for (var place = 1; place <= 3; place++) {
          var row = rows[place - 1];
          if (!row) {
            html += '<article class="slot wait m' + place + '"><div class="who">' + MaglevMeet.medalIcon(place) + '<span class="medal">' + MEDAL[place] + '</span></div><div class="name">等候成績</div><div class="time num">—</div></article>';
            continue;
          }
          html += '<article class="slot m' + place + '">';
          html += '<div class="who">' + MaglevMeet.medalIcon(place) + '<span class="medal">' + MEDAL[place] + '</span><span class="name">' + esc(row.label) + '</span></div>';
          html += '<div class="time num">' + MaglevMeet.formatNum(row.best) + ' <span>秒</span></div>';
          html += '<div class="speed num">' + MaglevMeet.formatNum(row.speed) + ' 米/秒</div>';
          html += '</article>';
        }
        html += '</section>';
      });
      document.getElementById("grid").innerHTML = html;
      var live = document.getElementById("live");
      var on = view.status === "cloud";
      live.className = on ? "live" : "live off";
      live.querySelector("span").textContent = on ? "雲端即時" : "這部電腦即時";
    }

    document.getElementById("full").addEventListener("click", function () {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    });

    MaglevMeet.openSession(render);
  </script>
</body>
</html>
