<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="雷霆算式 手機版：一局三個場景的數學射擊遠征，單拇指甲板、可拉起的儀表板、戰場自動縮放。">
<title>雷霆算式｜手機版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%2305080f' width='16' height='16'/%3E%3Cpath fill='%2339f3ff' d='M7 1h2v3H7zM4 4h8v3H4zM2 7h12v3H2zM6 11h4v2H6z'/%3E%3C/svg%3E">
<style>
/* 雷霆算式｜手機版 — phone-first shell.
 * Same cabinet identity, redesigned for one thumb: JS-fitted board, docked deck,
 * slide-up dashboard, arcade stage-select rail. */

:root {
  --bg: #05080f;
  --ink: #eaf2ff;
  --dim: #93a4c8;
  --line: #2c457c;
  --cyan: #39f3ff;
  --pink: #ff4d8d;
  --amber: #ffd35c;
  --good: #b6ff4a;
  --bad: #ff8fa3;
  --panel: #0a1222;
  --cell: 40px;
  --gap: 3px;
  --dock-gap: 8px;
  --r: 10px;
}

* { box-sizing: border-box; }

html {
  height: 100%;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  overscroll-behavior: none;
  color: var(--ink);
  font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  font-size: 15px;
  line-height: 1.4;
  background:
    radial-gradient(ellipse 120% 55% at 50% -8%, #16294f 0%, transparent 60%),
    var(--bg);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* the starfield sits behind the cabinet so it never washes out the grid */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image:
    radial-gradient(1px 1px at 8% 18%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 22% 72%, #9ecbff 50%, transparent 51%),
    radial-gradient(1px 1px at 70% 20%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 64%, #9ecbff 50%, transparent 51%);
  opacity: 0.75;
}

button {
  font-family: inherit;
  font-size: inherit;
  color: var(--ink);
  cursor: pointer;
  touch-action: manipulation;
}

button:disabled { opacity: 0.4; cursor: not-allowed; }

.cabinet {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}

/* ------------------------------------------------------------ header / HUD */

header {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.brand { margin-right: auto; }

.logo {
  font-size: 19px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 1px;
}

.sub { display: none; }

.hud {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
  letter-spacing: 0.02em;
  color: var(--dim);
}

.stat b { color: var(--ink); font-weight: 700; }

#floor { display: none; }

#hearts { display: inline-flex; gap: 1px; }

.heart {
  color: #4b2a3b;
  font-size: 15px;
  line-height: 1;
}

.heart.on { color: var(--pink); text-shadow: 0 0 6px rgba(255, 77, 141, 0.65); }

.tools {
  display: flex;
  gap: 5px;
  width: 100%;
}

.ghost {
  position: relative;
  flex: 1;
  min-height: 40px;
  padding: 4px 6px;
  font-size: 12px;
  color: var(--dim);
  background: #0b1424;
  border: 1px solid var(--line);
  border-radius: var(--r);
}

.ghost.alert::after {
  content: "";
  position: absolute;
  top: 4px;
  right: 4px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 6px var(--amber);
}

/* -------------------------------------------------- arcade stage-select rail */

#rail {
  display: flex;
  gap: 4px;
  margin: 6px 0 5px;
}

.rail-seg {
  flex: 1;
  display: flex;
  gap: 2px;
  padding: 3px;
  background: #08101d;
  border: 1px solid #1b2b4d;
  border-radius: 6px;
}

.rail-seg.done { border-color: #23507a; }

.rail-seg.now { border-color: var(--cyan); box-shadow: 0 0 0 1px rgba(57, 243, 255, 0.25); }

.rail-tick {
  flex: 1;
  height: 5px;
  border-radius: 2px;
  background: #142440;
  transition: background 220ms ease-out;
}

.rail-tick.cleared { background: var(--good); }

.rail-tick.now {
  flex: 2.6;
  display: grid;
  place-items: center;
  font-family: Consolas, "Courier New", monospace;
  font-size: 9px;
  font-weight: 800;
  line-height: 5px;
  color: #04121a;
  background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan);
}

#banner {
  margin: 0 0 5px;
  text-align: center;
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--cyan);
}

#banner.foe { color: var(--amber); }

/* ------------------------------------------------------------------- board */

.layout {
  display: flex;
  flex: 1 1 auto;
  min-height: 0;
  flex-direction: column;
  gap: var(--dock-gap);
}

#stage {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
  display: grid;
  place-items: center;
}

#board {
  position: absolute;
  inset: 0;
  margin: auto;
  width: fit-content;
  height: fit-content;
  padding: 5px;
  background: #050b16;
  border: 2px solid #27407a;
  border-radius: 12px;
  box-shadow: 0 0 0 1px #0b1729, 0 14px 34px rgba(0, 0, 0, 0.55);
  touch-action: pan-y;
}

#cells {
  display: grid;
  grid-template-columns: repeat(8, var(--cell));
  grid-template-rows: repeat(8, var(--cell));
  gap: var(--gap);
}

.cell {
  width: var(--cell);
  height: var(--cell);
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.18)), #16294a;
  border-radius: 3px;
  display: grid;
  place-items: center;
  position: relative;
}

.cell.lane { background: #16305a; box-shadow: inset 0 0 0 1px #24457c; }

.cell.ground { box-shadow: inset 0 2px 0 #1c7c96; }

.cell.warn {
  background: linear-gradient(180deg, rgba(255, 77, 141, 0.3), rgba(255, 140, 40, 0.05) 70%), #191109;
  box-shadow: inset 0 0 0 1px #e07a18;
}

.cell.exact { box-shadow: inset 0 0 0 3px var(--good); }
.cell.chip { box-shadow: inset 0 0 0 3px var(--cyan); }
.cell.bad { box-shadow: inset 0 0 0 3px var(--bad); }
.cell.boss { background: #35132c; }
.cell.enemy { cursor: pointer; }

.mob {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding-bottom: 1px;
}

.mob svg {
  position: absolute;
  left: 50%;
  top: 2px;
  width: 62%;
  height: 48%;
  transform: translateX(-50%);
}

.mob.neg svg { filter: hue-rotate(190deg) saturate(1.35); }
.mob.frac svg { filter: hue-rotate(48deg) saturate(1.45); }

.num {
  position: relative;
  z-index: 2;
  font-family: Consolas, "Courier New", monospace;
  font-size: max(12px, calc(var(--cell) * 0.34));
  font-weight: 800;
  line-height: 1.05;
  color: #fff;
  background: #12060f;
  border: 1px solid #ff8ab6;
  border-radius: 4px;
  padding: 0 3px;
}

.num.long { font-size: max(9px, calc(var(--cell) * 0.24)); letter-spacing: -0.04em; }
.num.neg { border-color: var(--cyan); color: #e7fdff; }
.num.frac { border-color: var(--amber); color: #fff6d0; }

.eta {
  position: absolute;
  top: 0;
  right: 0;
  z-index: 2;
  font-family: Consolas, "Courier New", monospace;
  font-size: max(9px, calc(var(--cell) * 0.22));
  line-height: 1.15;
  color: var(--amber);
  font-weight: 700;
  background: rgba(6, 4, 12, 0.85);
  padding: 0 2px;
  border-radius: 0 3px 0 4px;
}

.mark {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 2;
  font-style: normal;
  font-weight: 800;
  font-size: max(9px, calc(var(--cell) * 0.22));
  line-height: 1.15;
  background: rgba(6, 4, 12, 0.85);
  padding: 0 2px;
  border-radius: 3px 0 4px 0;
}

.mark.neg { color: var(--cyan); }
.mark.frac { color: var(--amber); }

.boss-tag {
  font-size: max(9px, calc(var(--cell) * 0.26));
  font-weight: 800;
  color: #ffd0e2;
  letter-spacing: 1px;
}

.ship { position: relative; z-index: 3; }

.ship svg { width: var(--cell); height: var(--cell); display: block; }

.missile {
  position: absolute;
  left: 50%;
  top: 0;
  width: calc(var(--cell) * 0.32);
  height: calc(var(--cell) * 0.56);
  z-index: 1;
  pointer-events: none;
  animation: dive 0.7s ease-in infinite;
}

.cell:has(.ship) .missile,
.cell.enemy .missile {
  left: 1px;
  width: calc(var(--cell) * 0.24);
  height: calc(var(--cell) * 0.42);
  animation-name: diveSide;
}

@keyframes dive {
  from { transform: translate(-50%, -35%); opacity: 0.25; }
  to { transform: translate(-50%, 55%); opacity: 1; }
}

@keyframes diveSide {
  from { transform: translateY(-30%); opacity: 0.35; }
  to { transform: translateY(45%); opacity: 1; }
}

.mob.drop { animation: dropIn 320ms ease-out; }

@keyframes dropIn {
  from { transform: translateY(calc(-1 * (var(--cell) + var(--gap)))); }
  to { transform: translateY(0); }
}

/* --------------------------------------------------------- impact feedback */

.bolt {
  position: absolute;
  height: 4px;
  margin-top: -2px;
  transform-origin: 0 50%;
  border-radius: 2px;
  background: linear-gradient(90deg, transparent, #7ef6ff 35%, #fff);
  box-shadow: 0 0 8px var(--cyan);
  z-index: 6;
  pointer-events: none;
  transition: transform 280ms linear;
}

.bolt::after {
  content: "";
  position: absolute;
  right: -5px;
  top: -4px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 10px var(--cyan);
}

.burst {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

.burst::before,
.burst::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0.2);
  animation: boom 420ms ease-out forwards;
}

.burst::before { width: 78%; height: 78%; border: 3px solid #fff; }
.burst::after { width: 26%; height: 26%; background: #fff; }
.burst.exact::before { border-color: var(--good); }
.burst.exact::after { background: var(--good); box-shadow: 0 0 10px var(--good); }
.burst.chip::before { border-color: var(--cyan); }
.burst.chip::after { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
.burst.bad::before, .burst.player::before { border-color: #ff4d6a; }
.burst.bad::after, .burst.player::after { background: #ff4d6a; box-shadow: 0 0 12px #ff4d6a; }
.burst.shield::before { border-color: var(--cyan); }
.burst.shield::after { background: transparent; box-shadow: 0 0 0 4px var(--cyan); }

@keyframes boom {
  to { transform: translate(-50%, -50%) scale(1.7); opacity: 0; }
}

#board.hurt { animation: shake 420ms linear; }

#board.hurt::after,
#board.guard::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 12px;
  pointer-events: none;
  z-index: 7;
  animation: fadeFlash 450ms ease-out forwards;
}

#board.hurt::after { background: rgba(255, 36, 72, 0.5); }
#board.guard::after { background: rgba(57, 243, 255, 0.32); }

@keyframes shake {
  0%, 100% { transform: none; }
  18% { transform: translate(-7px, 2px); }
  36% { transform: translate(8px, -3px); }
  54% { transform: translate(-5px, -2px); }
  72% { transform: translate(4px, 2px); }
}

@keyframes fadeFlash { to { opacity: 0; } }


/* one-time control hint, sits on the board until the first move */
#hint {
  position: absolute;
  left: 50%;
  bottom: calc(6px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 9;
  max-width: 92%;
  padding: 6px 12px;
  font-size: 12px;
  color: #04121a;
  background: var(--amber);
  border-radius: 999px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
  transition: opacity 320ms ease-out, transform 320ms ease-out;
}

#hint.gone { opacity: 0; transform: translate(-50%, 8px); pointer-events: none; }

/* ---------------------------------------------------------------- the deck */

#side {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-bottom: 2px;
}

/* short phones: cards and operators share one line so the board keeps its size */
@media (max-height: 740px) {
  #side {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-areas:
      "read read read read read read"
      "hand hand hand hand tool tool"
      "move move move move move move";
  }
  #side > .panel:first-child { grid-area: read; }
  .cards { grid-area: hand; }
  .ops { grid-area: tool; order: 0; grid-template-columns: repeat(auto-fit, minmax(44px, 1fr)); }
  .moves { grid-area: move; }
}

@media (max-height: 740px) {
  #side { gap: 5px; }
  .card { min-height: 52px; font-size: 26px; }
  .op { width: 44px; min-height: 44px; font-size: 20px; }
  .moves button { min-height: 40px; font-size: 13px; }
  .moves #btn-fire { min-height: 46px; font-size: 16px; letter-spacing: 3px; }
  .expr { font-size: 24px; }
}

#side > .panel:first-child {
  background: var(--panel);
  border: 1px solid #1d3357;
  border-radius: var(--r);
  padding: 5px 9px 6px;
}

#side .panel h3 {
  margin: 0 0 6px;
  font-family: Consolas, "Courier New", monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: var(--dim);
}

/* readout: expression + swap on one line, hint below */
#side > .panel:first-child {
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-areas:
    "label label"
    "expr swap"
    "note note";
  align-items: center;
  column-gap: 10px;
}

#side > .panel:first-child h3 { display: none; }

.expr {
  grid-area: expr;
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-family: Consolas, "Courier New", monospace;
  font-size: 27px;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.expr.good { color: var(--good); }
.expr.bad { color: var(--bad); }

.note {
  grid-area: note;
  margin: 1px 0 0;
  min-height: 0;
  font-size: 11px;
  line-height: 1.3;
  color: var(--amber);
}

#btn-swap {
  grid-area: swap;
  width: auto;
  min-height: 44px;
  padding: 4px 10px;
  font-size: 12px;
  letter-spacing: 1px;
  background: #16264a;
  border: 2px solid #3d5a98;
  border-radius: var(--r);
  box-shadow: 0 3px 0 #000;
}

/* operators sit above the cards: pick pair, then operator, then fire */
.ops {
  order: -1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(44px, 1fr));
  gap: 6px;
}

.card,
.op {
  font-family: Consolas, "Courier New", monospace;
  font-weight: 800;
  background: #16264a;
  border: 2px solid #3d5a98;
  border-radius: var(--r);
  box-shadow: 0 3px 0 #000;
  color: var(--ink);
}

.card {
  position: relative;
  display: grid;
  place-items: center;
  min-height: clamp(58px, 8.6dvh, 92px);
  font-size: clamp(30px, 5.2dvh, 40px);
  line-height: 1;
}

.card small {
  position: absolute;
  top: 3px;
  left: 5px;
  font-family: "Microsoft JhengHei", sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--dim);
}

.op {
  display: grid;
  place-items: center;
  width: 52px;
  min-height: 52px;
  margin: 0 auto;
  font-size: 22px;
  line-height: 1;
  color: var(--amber);
  border-radius: 50%;
  border-color: #8a6a2a;
  background: #241a08;
  box-shadow: none;
}

#side .ops {
  row-gap: 5px;
  padding-left: 7px;
  border-left: 1px dashed #3a5788;
  align-content: center;
}

.ops::before {
  content: "運算";
  grid-column: 1 / -1;
  margin-bottom: -2px;
  font-family: Consolas, "Courier New", monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: var(--dim);
  text-align: center;
}

.op small {
  display: block;
  margin-top: 2px;
  font-family: "Microsoft JhengHei", sans-serif;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
  color: var(--bad);
}

.card.on,
.op.on {
  border-color: var(--cyan);
  color: var(--cyan);
  background: #123c52;
  box-shadow: 0 3px 0 #001018, 0 0 14px rgba(57, 243, 255, 0.35);
}

.card.hinted:not(.on),
.op.hinted:not(.on) { border-color: var(--amber); }

.op.jammed {
  border-color: var(--bad);
  color: var(--bad);
  text-decoration: line-through;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(48px, 1fr));
  gap: 6px;
}

/* movement + fire: fire owns the bottom thumb line */
.moves {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: var(--dock-gap);
}

.moves button {
  min-height: 44px;
  padding: 6px 4px;
  font-size: 14px;
  background: #16264a;
  border: 2px solid #3d5a98;
  border-radius: var(--r);
  box-shadow: 0 3px 0 #000;
  color: var(--ink);
}

.moves #btn-left { order: 1; grid-column: span 2; }
.moves #btn-skip { order: 2; grid-column: span 2; }
.moves #btn-right { order: 3; grid-column: span 2; }
.moves #btn-prism { order: 4; grid-column: span 3; }
.moves #btn-spare { order: 5; grid-column: span 3; }
.moves #btn-fire { order: 6; grid-column: 1 / -1; }
.moves #btn-skip-tutor { order: 7; grid-column: 1 / -1; }

.moves #btn-fire {
  min-height: clamp(52px, 7.2dvh, 76px);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 4px;
  color: #04121a;
  background: linear-gradient(180deg, #7ff9ff, var(--cyan));
  border-color: #d5feff;
  box-shadow: 0 4px 0 #0a3a45, 0 0 20px rgba(57, 243, 255, 0.45);
}

.moves #btn-fire:disabled {
  color: var(--dim);
  background: #16264a;
  border-color: #3d5a98;
  box-shadow: 0 3px 0 #000;
}

.moves .primary,
.moves #btn-skip-tutor {
  font-weight: 800;
  color: var(--cyan);
  border-color: var(--cyan);
}

.moves button.on {
  border-color: var(--amber);
  color: var(--amber);
  box-shadow: 0 3px 0 #000, 0 0 14px rgba(255, 211, 92, 0.4);
}

/* relics are reference material: mirrored into the dashboard sheet */
.relics-panel { display: none !important; }

.relics { display: flex; flex-wrap: wrap; gap: 5px; }

.relic {
  border: 1px solid var(--amber);
  border-radius: 6px;
  color: var(--amber);
  padding: 2px 6px;
  font-size: 12px;
}

.hint { margin: 6px 0 0; color: var(--dim); font-size: 12px; }

/* -------------------------------------------------------------- dashboard */

#dash {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 8;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  pointer-events: none;
}

#dash-card {
  width: min(560px, 100%);
  max-height: 62dvh;
  overflow: auto;
  padding: 10px 12px calc(14px + env(safe-area-inset-bottom));
  background: #0a1425;
  border-top: 2px solid var(--line);
  border-radius: 16px 16px 0 0;
  box-shadow: 0 -14px 34px rgba(0, 0, 0, 0.6);
  transform: translateY(105%);
  transition: transform 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
  pointer-events: auto;
}

body[data-dash="open"] #dash-card { transform: translateY(0); }

#dash-grip {
  width: 42px;
  height: 4px;
  margin: 0 auto 10px;
  border-radius: 3px;
  background: #2f4a7c;
}

#dash-title {

function gcd(a, b) {

function makeNeg(enemy) {

function pickEliteFraction() {
  const seen = {};
  const options = [];
  state.deck.forEach((a, i) => {
    state.deck.forEach((b, j) => {
      if (i === j || !b || a <= 0 || b <= 0 || a % b === 0) return;
      const r = rat(a, b);
      const key = r.n + '/' + r.d;
      if (r.n <= 0 || r.d <= 1 || r.n > 12 || seen[key]) return;
      seen[key] = true;
      options.push(r);
    });
  });
  if (!options.length) return null;
  options.sort((a, b) => a.n + a.d - (b.n + b.d));
  return options[rand(Math.min(4, options.length))];
}
function dressElite() {
  const list = state.combat.enemies.filter(enemy => !enemy.boss).slice().sort((a, b) => a.row - b.row);
  if (!list.length) return;
  const frac = state.ops.includes('÷') ? pickEliteFraction() : null;
  if (frac && list.length > 2) {
    list[0].hp = frac;
    list[0].kind = 'frac';
    makeNeg(list[1]);
    return;
  }
  if (frac && rand(2) === 0) {
    list[0].hp = frac;
    list[0].kind = 'frac';
    return;
  }
  makeNeg(list[0]);
}
function stageWave(step, type) {
  const waves = [
    [[3, 4, 4], [5, 2, 5]],
    [[1, 3, 3], [4, 2, 4], [6, 4, 3]],
    [[2, 1, 6], [6, 2, 5]],
    [[0, 1, 6], [3, 0, 8], [7, 2, 6]],
    [[1, 2, 5], [4, 0, 9], [6, 2, 5]],
    [[2, 0, 8], [5, 1, 8]],
    [[1, 1, 7], [4, 0, 10], [6, 2, 6]],
    [[2, 0, 9], [5, 0, 11]],
    [[0, 0, 8], [3, 0, 12], [6, 1, 8]]
  ];
  const wave = waves[Math.min(step, waves.length - 1)];
  const bonus = state.scene * 2 + (type === 'elite' ? 1 : 0);
  wave.forEach(item => spawnEnemy(item[0], Math.max(0, item[1] - state.scene), item[2] + bonus));
}

function buildRoute() {
  const early = shuffle(['combat', 'combat', 'event', 'shop']);
  const mid = shuffle(['combat', 'elite', 'event', 'shop']);
  const late = shuffle(['elite', 'combat', 'event', 'elite']);
  const route = [['combat']];
  route.push([early.pop(), early.pop()]);
  route.push([early.pop(), early.pop()]);
  route.push(['elite']);
  route.push([mid.pop(), mid.pop()]);
  route.push([mid.pop(), mid.pop()]);
  route.push(['combat']);
  route.push([late.pop(), late.pop()]);
  route.push([late.pop(), late.pop()]);
  route.push(['boss']);
  return route;
}

function resolveEnemy() {

      markFx('shield', state.col, PLAYER_ROW);

      pushLog('干擾箔把導彈偏掉了');
    } else if (hurt('彈幕命中')) return true;
    } else {

    }
  }
  const stepDown = !hasRelic('brake') || combat.turn % 2 === 0;
  if (stepDown) {
    const movers = combat.enemies.filter(enemy => !enemy.boss).sort((a, b) => b.row - a.row);
    for (let i = 0; i < movers.length; i++) {
      const enemy = movers[i];
      if (!combat.enemies.some(item => item.id === enemy.id)) continue;
      const next = enemy.row + 1;
      if (next >= PLAYER_ROW) {
        combat.enemies = combat.enemies.filter(item => item.id !== enemy.id);
        if (hurt('第 ' + (enemy.col + 1) + ' 列的敵機衝過底線')) return true;

    }
  }
  combat.turn += 1;
  const boss = combat.enemies.find(enemy => enemy.boss);
  if (boss) {
    combat.charge += 1;
    if (combat.charge >= 3) pushLog('核心正在鎖定');
  }
  if (barrageOn()) {
    combat.pattern = makePattern();
    combat.warnings = combat.pattern.cols.slice();
  } else combat.warnings = [];
  return false;
}

function giveOp(op) {
  if (state.ops.includes(op)) giveCard(op === '×' ? 8 : 9);
  else { state.ops.push(op); pushLog('學會 ' + op); }
}
function giveRelic(id) {
  if (hasRelic(id)) { giveCard(6); return; }
  state.relics.push(id);
  if (id === 'plate') { state.maxHp += 1; state.hp = Math.min(state.maxHp, state.hp + 1); }

  else rewards.push({ kind: 'card', n: pick([6, 7, 8, 9]), title: '數字牌', text: '' });

  const options = shuffle(puzzle.opts.slice());
  showOverlay('核心鎖定', '<p class="q">' + esc(puzzle.q) + '</p><p class="q-note">答對：核心 −8。答錯：生命 −1。</p>', options.map(opt => ({

function answerPuzzle(choice, answer) {
  if (puzzleLock) return;
  puzzleLock = true;
  document.querySelectorAll('#overlay button').forEach(btn => { btn.disabled = true; });
  const note = document.querySelector('.q-note');
  const right = choice === answer;
  if (note) note.textContent = right ? '答對了。核心 −8。' : '答錯了。正確答案是 ' + answer + '。';
  const boss = state.combat.enemies.find(enemy => enemy.boss);
  if (right) {
    gain(25);
    if (boss) {
      boss.hp = Math.max(0, boss.hp - 8);
      if (boss.hp === 0) {
        state.combat.enemies = state.combat.enemies.filter(enemy => !enemy.boss);
        setTimeout(() => { hideOverlay(); onBossClear(); }, 700);
        return;
      }
    }
  }
  const dead = right ? false : hurt('核心反擊');
  setTimeout(() => {
    if (dead) { showLose('正確答案是 ' + answer + '。'); return; }
    hideOverlay();
    state.phase = 'combat';
    drawHand();
    render();
  }, 800);
}

  const boss = combat && combat.enemies.find(enemy => enemy.boss);
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (col === state.col) cell.classList.add('lane');
      if (combat && combat.warnings.includes(col)) cell.classList.add('warn');
      if (row === PLAYER_ROW) cell.classList.add('ground');
      const mob = combat && combat.enemies.find(enemy => !enemy.boss && enemy.col === col && enemy.row === row);
      if (boss && boss.cols.includes(col) && row <= 1) {
        cell.classList.add('boss', 'enemy');
        if (shotClass(boss.hp)) cell.classList.add(shotClass(boss.hp));
        if (row === 0 && col === 3) cell.innerHTML = '<span class="boss-tag">核心</span>';
        if (row === 1 && col === 3) cell.innerHTML = '<b class="num">' + fmt(boss.hp) + '</b>';
        cell.addEventListener('click', () => tryFire(boss));
      }

        const label = fmt(mob.hp);
        const tone = mob.kind === 'neg' ? ' neg' : mob.kind === 'frac' ? ' frac' : '';
        const mark = mob.kind === 'neg' ? '<i class="mark neg">逆</i>' : mob.kind === 'frac' ? '<i class="mark frac">分</i>' : '';
        cell.innerHTML = '<div class="mob' + (mob.slide && motionOk() ? ' drop' : '') + tone + '">' + BUG + mark + '<b class="num' + (label.length > 2 ? ' long' : '') + tone + '">' + label + '</b><span class="eta">' + (PLAYER_ROW - row) + '回</span></div>';
        cell.addEventListener('click', () => tryFire(mob));

  const jam = state.combat.lockedOp ? '<p>本回合禁用 ' + esc(state.combat.lockedOp) + (hasRelic('key') && !state.combat.keyUsed ? '，備援鑰匙可以打開' : '') + '</p>' : '';
  const note = state.tutorial ? TUTORIAL_NOTE[state.tutorial.step] : value == null ? '選兩張牌，再選運算。綠框代表可以擊破。' : zero ? '結果是 0，換一組。' : '點敵機發射。綠框擊破，青框削血，紅框打偏。';
  side.innerHTML = '<section class="panel"><h3>這一發</h3><div class="expr ' + kind + '">' + esc(expr) + '</div><p class="note">' + note + '</p><button type="button" class="primary" id="btn-swap">左右對調</button></section><div class="cards">' + cards + '</div><div class="ops">' + ops + '</div><div class="moves"><button type="button" id="btn-left">← 左移</button><button type="button" id="btn-right">右移 →</button><button type="button" id="btn-fire">打最底的</button><button type="button" id="btn-skip">跳過換牌</button>' + (canSpare ? '<button type="button" id="btn-spare">光彈 1</button>' : '') + (canPrism ? '<button type="button" id="btn-prism"' + (state.combat.prismOn ? ' class="on"' : '') + '>變號</button>' : '') + (state.tutorial ? '<button type="button" class="primary" id="btn-skip-tutor">跳過教程，直接開始</button>' : '') + '</div><section class="panel relics-panel"><h3>遺物</h3><div class="relics">' + relics + '</div>' + pattern + charge + jam + '<p class="hint">移動、跳過、發射都會結束回合。</p></section>';
  side.querySelectorAll('[data-card]').forEach(btn => btn.addEventListener('click', () => clickCard(Number(btn.dataset.card))));
  side.querySelectorAll('[data-op]').forEach(btn => btn.addEventListener('click', () => clickOp(btn.dataset.op)));
  document.getElementById('btn-swap').addEventListener('click', swapOps);
  document.getElementById('btn-left').addEventListener('click', () => move(-1));
  document.getElementById('btn-right').addEventListener('click', () => move(1));
  document.getElementById('btn-fire').addEventListener('click', fireLowest);
  document.getElementById('btn-skip').addEventListener('click', skipTurn);
  const spare = document.getElementById('btn-spare');
  if (spare) spare.addEventListener('click', fireSpare);
  const prism = document.getElementById('btn-prism');
  if (prism) prism.addEventListener('click', togglePrism);
  const skipTutor = document.getElementById('btn-skip-tutor');
  if (skipTutor) skipTutor.addEventListener('click', newRun);
  ['btn-left', 'btn-right', 'btn-fire', 'btn-skip', 'btn-swap', 'btn-skip-tutor', 'btn-prism'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) btn.disabled = state.busy;
  });
  if (state.col === 0) document.getElementById('btn-left').disabled = true;
  if (state.col === COLS - 1) document.getElementById('btn-right').disabled = true;
  if (state.tutorial) {
    const step = state.tutorial.step;
    document.getElementById('btn-left').disabled = true;
    document.getElementById('btn-skip').disabled = state.busy || step !== 'redraw';
    document.getElementById('btn-swap').disabled = state.busy || step !== 'finish';
    document.getElementById('btn-right').disabled = state.busy || step !== 'move';
    document.getElementById('btn-fire').disabled = state.busy || step === 'move' || step === 'redraw' || !tutorialShotOk();
  }
}
function renderLog() {
  const log = document.getElementById('log');
  log.innerHTML = state.log.length ? state.log.map(line => '<div>' + esc(line) + '</div>').join('') : '<div>戰鬥紀錄會出現在這裡。</div>';
}
function render() {
  renderHeader();
  renderBoard();
  renderSide();
  renderLog();
}
function onKey(event) {
  if (['ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
  if (event.repeat || state.phase !== 'combat' || state.busy) return;
  if (event.target && event.target.tagName === 'BUTTON' && (event.key === ' ' || event.key === 'Enter')) return;
  if (event.key === 'ArrowLeft') move(-1);
  else if (event.key === 'ArrowRight') move(1);
  else if (event.key === ' ') skipTurn();
  else if (event.key >= '1' && event.key <= '4') clickCard(Number(event.key) - 1);
  else if (event.key === 'Enter') fireLowest();
  else if (event.key === 'q' || event.key === 'Q') clickOp(state.ops[0]);
  else if ((event.key === 'e' || event.key === 'E') && state.ops[1]) clickOp(state.ops[1]);
}
function init() {
  loadBest();
  document.getElementById('btn-sound').addEventListener('click', () => {
    unlockAudio();
    state.sound = !state.sound;
    renderHeader();
  });
  document.getElementById('btn-help').addEventListener('click', showHelp);
  window.addEventListener('keydown', onKey);
  state.ops = ['+', '−'];
  state.deck = [1, 2, 3, 4, 2, 3];
  state.route = [['combat']];
  showTitle();
  render();
}
init();
</script>
<script>
/* 雷霆算式｜手機版 shell layer.
 * Display-only: fits the board to the phone viewport, paints the stage rail,
 * mirrors the combat dashboard into a slide-up sheet, and adds swipe + haptics.
 * It never touches the game rules — it only reads the DOM the game renders and
 * clicks the game's own buttons. */
(function () {
  "use strict";

  var GAP = 3;
  var FRAME = 14; // #board padding (5) + border (2 each side)
  var MIN_CELL = 24;
  var MAX_CELL = 72;

  var doc = document;
  var root = doc.documentElement;
  var body = doc.body;

  function el(id) {
    return doc.getElementById(id);
  }

  function text(node) {
    return node ? node.textContent.trim() : "";
  }

  /* -------------------------------------------------- board fits the screen */

  function measureGap() {
    var v = parseFloat(root.style.getPropertyValue("--gap") || "");
    if (!v) v = parseFloat(getComputedStyle(root).getPropertyValue("--gap"));
    return isFinite(v) && v > 0 ? v : GAP;
  }

  /** Re-measure until the layout stops reacting to the cell size. */
  function fitBoard() {
    var stage = el("stage");
    if (!stage) return;
    var gap = measureGap();
    for (var pass = 0; pass < 4; pass++) {
      var box = stage.getBoundingClientRect();
      if (!box.width || !box.height) return;
      var avail = Math.min(box.width, box.height);
      var next = Math.floor((avail - FRAME - gap * 7) / 8);
      next = Math.max(MIN_CELL, Math.min(MAX_CELL, next));
      var current = parseFloat(root.style.getPropertyValue("--cell")) || 0;
      root.style.setProperty("--cell", next + "px");
      if (next === current) return;
    }
  }

  /* ------------------------------------------------- arcade stage-select rail */

  var rail = el("rail");
  var railKey = "";

  function parseRail() {
    var floor = text(el("floor"));
    var scene = /場景\s*(\d+)\/(\d+)/.exec(floor);
    var station = /第\s*(\d+)\/(\d+)\s*站/.exec(floor);
    if (!scene && !station) return null;
    return {
      scenes: scene ? Number(scene[2]) : 3,
      scene: scene ? Number(scene[1]) : 1,
      total: station ? Number(station[2]) : 10,
      step: station ? Math.max(1, Number(station[1])) : 1,
    };
  }

  function renderRail() {
    if (!rail) return;
    var info = parseRail();
    var key = info
      ? info.scenes + "/" + info.scene + "/" + info.total + "/" + info.step
      : "idle";
    if (key === railKey) return;
    railKey = key;
    rail.innerHTML = "";
    if (!info) {
      rail.style.display = "none";
      return;
    }
    rail.style.display = "";
    for (var s = 1; s <= info.scenes; s++) {
      var seg = doc.createElement("div");
      seg.className = "rail-seg" + (s < info.scene ? " done" : s === info.scene ? " now" : "");
      for (var t = 1; t <= info.total; t++) {
        var tick = doc.createElement("span");
        var cls = "rail-tick";
        if (s < info.scene || (s === info.scene && t < info.step)) cls += " cleared";
        else if (s === info.scene && t === info.step) {
          cls += " now";
          tick.textContent = String(t);
        }
        tick.className = cls;
        seg.appendChild(tick);
      }
      rail.appendChild(seg);
    }
  }

  /* --------------------------------------- combat dashboard slide-up sheet */

  var side = el("side");
  var dashBody = el("dash-body");
  var btnDash = el("btn-dash");

  function mirrorDash() {
    if (!side || !dashBody) return;
    // In combat, mirror the relic/barrage/charge panel; otherwise the run summary.
    var panel = side.querySelector(".relics-panel") || side.querySelector(".panel");
    var html = panel ? panel.textContent.replace(/\s+/g, " ").trim() : "";
    if (dashBody.textContent !== html) dashBody.textContent = html;
    var urgent = /導彈|蓄力|禁用/.test(html);
    if (btnDash) btnDash.classList.toggle("alert", urgent && body.dataset.dash !== "open");
  }

  function setDash(open) {
    if (open) body.dataset.dash = "open";
    else delete body.dataset.dash;
    if (btnDash) btnDash.setAttribute("aria-expanded", open ? "true" : "false");
    mirrorDash();
  }

  if (btnDash) {
    btnDash.addEventListener("click", function () {
      setDash(body.dataset.dash !== "open");
    });
  }

  var backdrop = el("dash-backdrop");
  if (backdrop) {
    backdrop.addEventListener("click", function () {
      setDash(false);
    });
  }

  var dashCard = el("dash-card");
  if (dashCard) {
    var startY = 0;
    var dragging = false;
    dashCard.addEventListener(
      "touchstart",
      function (e) {
        if (e.touches.length !== 1) return;
        startY = e.touches[0].clientY;
        dragging = dashCard.scrollTop <= 0;
      },
      { passive: true },
    );
    dashCard.addEventListener(
      "touchmove",
      function (e) {
        if (!dragging || e.touches.length !== 1) return;
        if (e.touches[0].clientY - startY > 12) {
          dragging = false;
          setDash(false);
        }
      },
      { passive: true },
    );
  }

  /* ------------------------------------------------------ swipe to relocate */

  var board = el("board");

  function tapMove(dir) {
    var button = el(dir > 0 ? "btn-right" : "btn-left");
    if (button && !button.disabled) button.click();
  }

  /**
   * A horizontal drag on empty sky walks the ship. The drag is suppressed when
   * it starts on an enemy or on a walkable ground tile, so a tap on those still
   * fires the game's own click handler.
   */
  if (board) {
    var x0 = 0;
    var y0 = 0;
    var busy = false;
    var blocked = false;
    var axis = 0;

    board.addEventListener(
      "touchstart",
      function (e) {
        if (e.touches.length !== 1) {
          busy = false;
          return;
        }
        var t = e.touches[0];
        x0 = t.clientX;
        y0 = t.clientY;
        axis = 0;
        busy = true;
        var node = t.target;
        blocked = !!(node && node.closest && node.closest(".cell.enemy"));
      },
      { capture: true, passive: true },
    );

    board.addEventListener(
      "touchmove",
      function (e) {
        if (!busy || axis || e.touches.length !== 1) return;
        var t = e.touches[0];
        var dx = t.clientX - x0;
        var dy = t.clientY - y0;
        if (Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy) * 1.6) axis = dx > 0 ? 1 : -1;
      },
      { capture: true, passive: true },
    );

    board.addEventListener(
      "touchend",
      function (e) {
        if (!busy) return;
        busy = false;
        if (!axis || blocked) return;
        e.preventDefault();
        e.stopPropagation();
        tapMove(axis);
        hideHint();
      },
      { capture: true },
    );

    board.addEventListener(
      "touchcancel",
      function () {
        busy = false;
        axis = 0;
      },
      { capture: true, passive: true },
    );
  }

  /* ------------------------------------------------------------- haptics */

  function buzz(pattern) {
    if (navigator.vibrate) {
      try {
        navigator.vibrate(pattern);
      } catch (err) {
        /* 不支援震動就没感觉 */
      }
    }
  }

  var lastLog = "";

  function feelImpact() {
    var log = el("log");
    var lines = log ? log.children : [];
    var latest = lines.length ? lines[lines.length - 1].textContent : "";
    if (!latest || latest === lastLog) return;
    lastLog = latest;
    if (/擊破|清空/.test(latest)) buzz(24);
    else if (/打偏|剩下/.test(latest)) buzz(9);
    else if (/命中|衝過底線|反擊/.test(latest)) buzz([34, 26, 52]);
    else if (/護盾|干擾箔/.test(latest)) buzz([12, 30, 12]);
  }

  /* -------------------------------------------------------------- first hint */

  var hint = el("hint");
  var hintTimer = 0;

  function hideHint() {
    if (hint) hint.classList.add("gone");
    if (hintTimer) {
      clearTimeout(hintTimer);
      hintTimer = 0;
    }
  }

  if (hint) {
    hint.addEventListener("click", hideHint);
    hintTimer = setTimeout(hideHint, 6500);
  }

  if (side) {
    side.addEventListener("click", function (e) {
      var cell = e.target;
      if (cell && cell.closest && cell.closest(".moves")) hideHint();
    });
  }

  /* ------------------------------------------------------------- observers */

  function watch(node, options, run) {
    if (!node || !window.MutationObserver) return;
    new MutationObserver(run).observe(node, options);
  }

  watch(side, { childList: true, subtree: true }, function () {
    fitBoard();
    mirrorDash();
  });

  watch(el("floor"), { childList: true, characterData: true, subtree: true }, renderRail);
  watch(el("log"), { childList: true, characterData: true, subtree: true }, feelImpact);

  window.addEventListener("resize", fitBoard);
  window.addEventListener("orientationchange", function () {
    setTimeout(fitBoard, 260);
  });
  if (window.ResizeObserver) {
    new ResizeObserver(fitBoard).observe(el("stage"));
  }

  doc.addEventListener("visibilitychange", function () {
    if (!doc.hidden) {
      fitBoard();
      renderRail();
    }
  });

  // The game writes every region once on load; sync after the first paint pass.
  requestAnimationFrame(function () {
    fitBoard();
    renderRail();
    mirrorDash();
  });
})();
</script>
</body>
</html>
